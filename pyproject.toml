[project]
name = "learngeo"
version = "0.1.0"
description = "A world-knowledge quiz show: flags, borders, maps, leaders and famous faces, with a fact card after every answer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
    "requests>=2.32",
]

# Only the dataset build needs these. Shapely pulls GEOS, which a deploy has
# no reason to compile just to serve a JSON file that is already built.
[project.optional-dependencies]
build = [
    "shapely>=2.1.2",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
