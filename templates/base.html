<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LearnGeo{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="graticule" aria-hidden="true"></div>
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="{{ url_for('home') }}">Learn<span>Geo</span></a>
    <a href="{{ url_for('play', category='grand_tour') }}">Play</a>
    <a href="{{ url_for('atlas') }}">Atlas</a>
    <a href="{{ url_for('topics_index') }}">Topics</a>
    <a href="{{ url_for('progress') }}">Progress</a>
  </nav>
</div>
<main>{% block body %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
